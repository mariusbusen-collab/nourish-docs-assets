<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ede3">
<title>what's your utility function?</title>
<script>try{var t=localStorage.getItem("m-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="../../design-system/fonts.css">
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../../design-system/base.css">
<link rel="stylesheet" href="../../design-system/components.css">
<style>
/* ---------- app roles, mapped onto the margin design system (../design-system/tokens.css) ---------- */
:root {
  --page: var(--bg);
  --surface-1: var(--surface);
  --surface-2: var(--surface-sunk);
  --surface-3: var(--surface-press);
  --ink: var(--text);
  --ink-2: var(--text-2);
  --ink-3: var(--text-3);
  --grid: var(--chart-grid);
  --axis: var(--chart-axis);
  --border: var(--line);
  --shadow: var(--shadow-1);
  --shadow-lift: var(--shadow-2);
  --s1: var(--data-1);       /* stated */
  --s2: var(--data-2);       /* revealed */
  --s3: var(--data-3);       /* wished */
  --hanni: var(--data-pos);  /* chase */
  --nanni: var(--data-neg);  /* escape */
  --ref: var(--data-ref);
  --tint-hanni: var(--tint-pos);
  --tint-nanni: var(--tint-neg);
  --tint-s1: var(--tint-1);
  --wash: var(--surface-sunk);
  --serif: var(--font-display);
  --sans: var(--font-ui);
  --mono: var(--font-mono);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  min-height: 100vh;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--tint-hanni); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 3px; border-radius: 10px; }
.serif { font-family: var(--serif); font-optical-sizing: auto; }
h1, h2, .display { font-family: var(--serif); font-optical-sizing: auto; font-weight: 420; letter-spacing: -0.02em; margin: 0; }
h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.02; }
h2 { font-size: 26px; line-height: 1.15; margin-bottom: 8px; }
h3 { font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin: 0 0 12px; }
p { margin: 0 0 12px; }
em, .it { font-family: var(--serif); font-style: italic; font-weight: 380; }
.sub { color: var(--ink-2); }
.muted { color: var(--ink-3); font-size: 13px; }
.hint { font-size: 12px; color: var(--ink-3); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; max-width: 1100px; margin: 0 auto; padding: 28px 28px 96px; }
.app.wide { grid-template-columns: 1fr; }
@media (max-width: 1000px) { .app { grid-template-columns: 1fr; padding: 18px 16px 110px; } aside.panel { display: none; } aside.panel.open { display: block; } }

/* ---------- progress: beads on a thread ---------- */
.topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; min-height: 30px; }
.thread { position: relative; display: flex; justify-content: space-between; align-items: center; flex: 1; max-width: 360px; }
.thread::before { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 1.5px; background: var(--axis); }
.bead { position: relative; width: 16px; height: 16px; }
.bead svg { display: block; }
.bead.now { transform: scale(1.35); }
.toplabel { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.toplabel b { font-family: var(--serif); font-style: italic; font-weight: 420; font-size: 15px; color: var(--ink); }
.toplabel span { color: var(--ink-3); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .toplabel .chname { display: none; } }

/* ---------- the deck ---------- */
.stage { position: relative; isolation: isolate; }
.stage::before, .stage::after {
  content: ""; position: absolute; inset: 10px 14px -8px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 22px; z-index: -1; transform: rotate(-1.6deg); transform-origin: 30% 100%;
}
.stage::after { inset: 18px 26px -15px; transform: rotate(1.3deg); background: var(--surface-3); z-index: -2; opacity: .7; }
.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 22px; padding: 40px 44px 30px;
  min-height: 470px; display: flex; flex-direction: column; box-shadow: var(--shadow); position: relative; will-change: transform;
}
@media (max-width: 600px) { .card { padding: 26px 22px 20px; min-height: 440px; border-radius: 18px; } }
.kicker { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
.prompt { font-size: 14px; color: var(--ink-2); margin-bottom: 10px; }
.q { font-family: var(--serif); font-optical-sizing: auto; font-size: clamp(24px, 3.2vw, 32px); line-height: 1.24; font-weight: 400; letter-spacing: -0.015em; margin: 0 0 28px; text-wrap: balance; }
.spacer { flex: 1; min-height: 20px; }

/* likert as growing dots */
.dots { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 6px 4px; }
.dot {
  width: var(--d); height: var(--d); border-radius: 50%; border: 2px solid var(--ink-2); background: transparent; cursor: pointer; padding: 0;
  display: grid; place-items: center; transition: background .18s var(--ease-out), border-color .18s, transform .2s var(--ease-out); flex: none;
}
.dot:hover { background: var(--surface-3); transform: scale(1.08); }
.dot.sel { background: var(--ink); border-color: var(--ink); }
.dot svg { opacity: 0; transition: opacity .15s; }
.dot.sel svg { opacity: 1; }
.dotends { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--ink-3); }
.dotends span:last-child { text-align: right; }
.dotends b { font-family: var(--serif); font-style: italic; font-weight: 420; font-size: 16px; color: var(--ink); min-width: 140px; text-align: center; }
@media (max-width: 420px) { .dotends b { min-width: 0; } .dotends { font-size: 12px; } }

/* list options */
.opts { display: grid; gap: 10px; }
.opt.row {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 15px 18px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface-1); cursor: pointer; font-size: 15px;
  transition: background .15s, border-color .15s, transform .2s var(--ease-out), box-shadow .2s;
}
.opt.row:hover { background: var(--surface-2); transform: translateX(3px); }
.opt.row.sel { background: var(--ink); color: var(--surface-1); border-color: var(--ink); }
.opt.row .key { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font: 500 13px/1 var(--serif); font-style: italic; opacity: .7; flex: none; }

/* this-or-that */
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
.paircard {
  min-height: 190px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface-1); box-shadow: var(--shadow);
  padding: 24px 22px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px; text-align: left;
  transition: rotate .3s var(--ease-out), translate .3s var(--ease-out), box-shadow .3s, background .2s, border-color .2s;
}
.paircard:nth-child(1) { rotate: -1.4deg; }
.paircard:nth-child(3) { rotate: 1.2deg; }
.paircard:hover { rotate: 0deg; translate: 0 -4px; box-shadow: var(--shadow-lift); }
.paircard .t { font-family: var(--serif); font-size: 23px; line-height: 1.15; font-weight: 420; letter-spacing: -0.01em; }
.paircard .s { font-size: 13px; color: var(--ink-3); }
.paircard.sel { background: var(--ink); color: var(--surface-1); border-color: var(--ink); }
.paircard.sel .s { color: var(--surface-3); }
.paircard .glyph { width: 34px; height: 34px; margin-bottom: 4px; }
.or { font-family: var(--serif); font-style: italic; color: var(--ink-3); font-size: 17px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--page); border: 1px solid var(--border); }
@media (max-width: 680px) { .pair { grid-template-columns: 1fr; } .or { justify-self: center; margin: -6px 0; z-index: 1; } .paircard { min-height: 120px; } }
.note { font-family: var(--serif); }
.note .t { font-size: 34px; letter-spacing: -0.02em; font-variant-numeric: lining-nums; }

/* sliders */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track, var(--surface-3)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track, var(--surface-3)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform .15s; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--ink); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
.sunmoon { --track: linear-gradient(90deg, var(--hanni), var(--surface-3) 50%, var(--nanni)); }
.moonsun { --track: linear-gradient(90deg, var(--nanni), var(--surface-3) 50%, var(--hanni)); }
.bip { margin: 4px 0 26px; }
.bip .lead { font-size: 15px; color: var(--ink-2); margin-bottom: 4px; }
.bip .ends { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; color: var(--ink-2); }
.bip .ends span { display: inline-flex; align-items: center; gap: 6px; }
.gridrow { display: grid; grid-template-columns: 130px 1fr 34px; gap: 16px; align-items: center; padding: 5px 0; }
.gridrow .nm { font-size: 14px; font-weight: 500; }
.gridrow output { text-align: right; font: 500 18px/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; }
@media (max-width: 600px) { .gridrow { grid-template-columns: 1fr 34px; gap: 2px 12px; } .gridrow .nm { grid-column: 1 / -1; } }

/* hours stepper */
.hrs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px; }
@media (max-width: 600px) { .hrs { grid-template-columns: 1fr; } }
.hr { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.hr .nm { font-size: 14px; font-weight: 500; }
.step { display: inline-flex; align-items: center; gap: 4px; }
.step button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-size: 17px; line-height: 1; display: grid; place-items: center; transition: background .15s, transform .1s; }
.step button:hover { background: var(--surface-3); }
.step button:active { transform: scale(.9); }
.step input { width: 46px; text-align: center; border: 0; background: transparent; color: var(--ink); font: 500 20px/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; -moz-appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.week { margin: 18px 0 4px; }
.week .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.week .bar i { display: block; height: 100%; transition: width .35s var(--ease-out); }
.week .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 6px; }

/* wish pills */
.wishrow { display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: center; padding: 6px 0; }
.seg { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 13px; font-size: 13px; cursor: pointer; border-radius: 999px; transition: background .15s, color .15s; }
.seg button:hover { background: var(--surface-3); }
.seg button.sel { background: var(--ink); color: var(--surface-1); }
@media (max-width: 600px) { .wishrow { grid-template-columns: 1fr; gap: 6px; padding: 8px 0; } }

/* reflect: lined paper */
textarea {
  width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--border); border-radius: 14px; padding: 6px 18px 12px; outline: none;
  font: italic 380 20px/36px var(--serif); color: var(--ink); background-color: var(--surface-2);
  background-image: linear-gradient(transparent 35px, var(--grid) 35px, var(--grid) 36px); background-size: 100% 36px; background-attachment: local;
}
textarea:focus { border-color: var(--ink-3); }
input[type=text] { font: inherit; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); width: 280px; max-width: 100%; outline: none; }
input[type=text]:focus { border-color: var(--ink-3); }

/* buttons & nav */
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 26px; }
.card .m-btn, .actions .m-btn { font-size: 15px; padding: 0.8em 1.35em; }
.m-btn.is-ghost { font-size: 14px; }

/* quotes */
.quote { font-family: var(--serif); font-style: italic; font-weight: 360; font-size: clamp(19px, 2.4vw, 23px); line-height: 1.4; color: var(--ink-2); margin: 8px 0 22px; padding-left: 18px; border-left: 2px solid var(--accent); text-wrap: pretty; }
.quote b { font-weight: 480; color: var(--ink); }

/* welcome & chapter */
.hero { display: grid; grid-template-columns: 1fr 1fr; align-items: end; gap: 6px; max-width: 340px; margin: -8px auto 8px; }
.hero figure { margin: 0; text-align: center; }
.hero figcaption { font: italic 400 16px/1.2 var(--serif); color: var(--ink-2); margin-top: -4px; }
.hero .m-sticker, .revealchar .m-sticker, .rhero .art .m-sticker { width: 100%; }
.chnum { font: italic 300 88px/0.8 var(--serif); color: var(--accent); letter-spacing: -0.04em; }
.chhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
.chicon { width: 96px; height: 96px; flex: none; }
.unlockline { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; }

/* reveal */
.stamp {
  display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .14em;
  color: var(--accent); border: 1.5px solid currentColor; border-radius: 999px; padding: 7px 12px; transform: rotate(-3deg); margin-bottom: 18px;
}
.big { font: 400 clamp(64px, 9vw, 92px)/0.95 var(--serif); letter-spacing: -0.035em; font-variant-numeric: lining-nums; margin: 6px 0 10px; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 18px; }
.vs > div { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; }
.vs .k { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.vs .v { font: 400 40px/1.1 var(--serif); letter-spacing: -0.02em; font-variant-numeric: lining-nums; }
.rbar { display: grid; grid-template-columns: 130px 1fr 48px; gap: 12px; align-items: center; margin: 10px 0; font-size: 15px; }
.rbar .tr { height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.rbar .tr i { display: block; height: 100%; border-radius: 6px; background: var(--s1); }
.rbar b { font: 500 17px/1 var(--serif); text-align: right; font-variant-numeric: lining-nums; }
.revealchar { float: right; width: 120px; margin: -10px -6px 4px 12px; }
@media (max-width: 600px) { .revealchar { width: 92px; } .rbar { grid-template-columns: 100px 1fr 44px; } }

/* ---------- live panel ---------- */
aside.panel { position: sticky; top: 28px; align-self: start; max-height: calc(100vh - 56px); overflow: auto; scrollbar-width: thin; }
@media (max-width: 1000px) {
  aside.panel.open { position: fixed; inset: auto 0 0 0; max-height: 80vh; z-index: 50; background: var(--page); padding: 22px 16px 34px; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.25); }
}
.pcard { padding: 4px 2px 18px; margin-bottom: 18px; border-bottom: 1px solid var(--grid); }
.pcard:last-child { border-bottom: 0; }
.ptitle { font: italic 420 20px/1.2 var(--serif); margin: 0 0 10px; letter-spacing: -0.01em; }
.peq { font: italic 380 17px/1.75 var(--serif); }
.peq .t { white-space: nowrap; border-radius: 6px; padding: 0 2px; }
.peq .t.new { animation: ink 1.4s var(--ease-out); }
@keyframes ink { from { background: var(--tint-hanni); } to { background: transparent; } }
.vbar { display: grid; grid-template-columns: 92px 1fr 32px; gap: 10px; align-items: center; font-size: 12.5px; margin: 7px 0; color: var(--ink-2); }
.vbar .tr { height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.vbar .tr i { display: block; height: 100%; background: var(--s1); border-radius: 4px; transition: width .6s var(--ease-out), opacity .6s; }
.vbar span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.meter { margin: 14px 0; font-size: 12px; }
.meter .lbl { display: flex; justify-content: space-between; color: var(--ink-2); margin-bottom: 6px; }
.meter .track { position: relative; height: 4px; border-radius: 2px; background: var(--surface-3); }
.meter .track.sm { background: linear-gradient(90deg, var(--nanni), var(--surface-3) 50%, var(--hanni)); opacity: .8; }
.meter .pin { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--ink); transform: translate(-50%, -50%); transition: left .7s var(--ease-out); }
.meter.locked { color: var(--ink-3); }
.meter.locked .lbl { color: var(--ink-3); }
.meter.locked .track { background: repeating-linear-gradient(90deg, var(--surface-3) 0 4px, transparent 4px 8px); }
.chlist { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
.chlist li { display: flex; gap: 10px; align-items: center; padding: 4px 0; color: var(--ink-3); }
.chlist li.done { color: var(--ink-2); }
.chlist li.now { color: var(--ink); font-weight: 500; }
.chlist li i { width: 18px; text-align: center; font-style: normal; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px dashed var(--axis); border-radius: 999px; padding: 4px 10px 4px 6px; color: var(--ink-3); }
.badge .g { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-size: 11px; }
.badge.on { border-style: solid; border-color: var(--hanni); color: var(--ink); background: var(--tint-hanni); }
.badge.on .g { background: var(--hanni); color: #fff; }
.fab { display: none; position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 51; border-radius: 999px; padding: 11px 18px 11px 14px; background: var(--ink); color: var(--surface-1); border: 0; cursor: pointer; box-shadow: var(--shadow-lift); font-size: 14px; align-items: center; gap: 8px; }
.fab .mini { font: italic 400 14px/1 var(--serif); opacity: .75; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 1000px) { .fab.show { display: inline-flex; } }

/* toast: a paper slip */
.m-toast b { font-family: var(--serif); font-style: italic; font-weight: 450; }
.m-toast { white-space: nowrap; }
.m-toast .up { color: var(--s3); } .m-toast .down { color: var(--s2); }

/* inline icons (margin's base.css makes svg block-level) */
:where(.legend, .ends, .tile .k, .meter .lbl, .badge, .lead) svg { display: inline-block; vertical-align: -0.15em; }
.dot svg { display: block; }

/* app header, from margin's m-nav */
.app-top { max-width: 1100px; margin: 0 auto; padding: 0 28px; }
.app-top .m-nav { padding-block: 18px 6px; }
.app-top .m-wordmark { font-size: 18px; }
.app-top .by { font: 400 12px/1 var(--mono); color: var(--text-3); }
@media (max-width: 1000px) { .app-top { padding: 0 16px; } .app-top .m-nav { flex-direction: row; align-items: center; } }
@media (max-width: 520px) { .app-top .by { display: none; } }

/* ---------- results ---------- */
.results { max-width: 840px; margin: 0 auto; width: 100%; }
.rhero { display: grid; grid-template-columns: 1fr 220px; gap: 24px; align-items: center; margin: 10px 0 8px; }
@media (max-width: 700px) { .rhero { grid-template-columns: 1fr; } .rhero .art { max-width: 200px; margin: 0 auto; order: -1; } }
.arch { font: 400 clamp(52px, 8vw, 84px)/0.95 var(--serif); letter-spacing: -0.035em; margin: 6px 0 14px; }
.arch em { font-weight: 330; }
.lead { font: 400 21px/1.4 var(--serif); letter-spacing: -0.005em; text-wrap: pretty; }
.rcard { background: var(--surface-1); border: 1px solid var(--border); border-radius: 20px; padding: 28px 30px; margin: 18px 0; box-shadow: var(--shadow); }
@media (max-width: 600px) { .rcard { padding: 22px 18px; } }
.rcard > .sub { margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
@media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); }
.tile .k { font: 600 10.5px/1.2 var(--sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: .12em; }
.tile .v { font: 400 42px/1.05 var(--serif); letter-spacing: -0.025em; margin: 8px 0 4px; font-variant-numeric: lining-nums; }
.tile .d { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.eq { font: italic 380 clamp(19px, 2.6vw, 25px)/1.85 var(--serif); }
.eq .t { white-space: nowrap; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg text { fill: var(--ink-2); font: 12px var(--sans); }
svg .tick { fill: var(--ink-3); font-variant-numeric: tabular-nums; }
svg .strong { fill: var(--ink); font-weight: 600; }
svg .serifl { font: italic 15px var(--serif); fill: var(--ink-2); }
.list { padding-left: 0; list-style: none; margin: 0; }
.list li { position: relative; padding-left: 26px; margin-bottom: 14px; }
.list li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: .8; }
.qs li { font: 400 19px/1.4 var(--serif); }
.qs li:last-child { font-style: italic; font-weight: 480; }
.words blockquote { margin: 0 0 18px; padding: 0; }
.words blockquote small { display: block; color: var(--ink-3); font-size: 12.5px; margin-bottom: 4px; }
.words blockquote p { font: italic 380 21px/1.4 var(--serif); margin: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.sources { font-size: 13.5px; color: var(--ink-2); }
.sources li { margin-bottom: 6px; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; font-size: 13px; box-shadow: var(--shadow-lift); opacity: 0; transition: opacity .12s; max-width: 260px; z-index: 70; }

/* motion niceties */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes sway { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-2deg); } }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-14deg); } 80% { transform: rotate(8deg); } 90% { transform: rotate(-8deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print { .rcard, .tile { opacity: 1 !important; } .actions, .topbar, .fab, aside, .app-top { display: none !important; } body { background: #fff; } .rcard, .tile { box-shadow: none; break-inside: avoid; } }

function pickPair() {
  const sc = Object.fromEntries(valueScores().map(x => [x.k, x.score]));
  const seen = new Set(Object.values(S.pairs).map(p => [...p].sort().join("|")));
  const appear = Object.fromEntries(VALUES.map(v => [v.k, 0]));
  Object.values(S.pairs).forEach(p => p.forEach(k => appear[k]++));
  let best = null;
  for (let i = 0; i < VALUES.length; i++) for (let j = i + 1; j < VALUES.length; j++) {
    const a = VALUES[i].k, b = VALUES[j].k; if (seen.has([a, b].sort().join("|"))) continue;
    const cost = Math.abs(sc[a] - sc[b]) + 0.6 * (appear[a] + appear[b]) + Math.random() * 0.15;
    if (!best || cost < best.c) best = { c: cost, p: Math.random() < 0.5 ? [a, b] : [b, a] };
  }
  return best.p;
}

/* step-specific motion after render */
function afterRender(s) {
  const card = $(".card");
  if (s.type === "likert") {
    const dots = card.querySelectorAll(".dot");
    if (M && !REDUCE) anim(dots, { scale: [0.4, 1], opacity: [0, 1] }, { ...SPRING, delay: M.stagger(0.035, { startDelay: 0.08 }) });
  }
  if (s.type === "pair" || s.type === "titr") {
    const cs = card.querySelectorAll(".paircard");
    if (M && !REDUCE) cs.forEach((c, i) => anim(c, { y: [24, 0], opacity: [0, 1] }, { ...SPRING, delay: 0.06 + i * 0.07 }));
  }
  if (s.type === "choice" || (s.type === "predict" && s.kind === "pick")) {
    const rows = card.querySelectorAll(".opt.row");
    if (M && !REDUCE) anim(rows, { y: [10, 0], opacity: [0, 1] }, { duration: 0.35, ease: [0.22, 1, 0.36, 1], delay: M.stagger(0.04, { startDelay: 0.08 }) });
  }
  if (s.type === "chapter") {
    anim(card.querySelector(".chicon"), { rotate: [-12, 0], scale: [0.6, 1], opacity: [0, 1] }, { ...SPRING, delay: 0.1 });
    anim(card.querySelector(".chnum"), { y: [20, 0], opacity: [0, 1] }, { ...SPRING, delay: 0.05 });
  }
  if (s.type === "welcome") {
    const figs = card.querySelectorAll(".hero figure");
    figs.forEach((f, i) => anim(f, { y: [30, 0], opacity: [0, 1], rotate: [i ? 6 : -6, 0] }, { ...SPRING, delay: 0.1 + i * 0.12 }));
  }
  if (s.type === "reveal") {
    anim($("#stamp"), { scale: [1.6, 1], opacity: [0, 1], rotate: [-12, -3] }, { type: M && M.spring, bounce: 0.45, visualDuration: 0.4, delay: 0.15 });
    setTimeout(() => card.querySelectorAll(".rbar .tr i").forEach((el, i) => { el.style.transition = `width .9s cubic-bezier(.22,1,.36,1) ${i * 0.08}s`; el.style.width = el.dataset.w + "%"; }), 120);
    card.querySelectorAll("[data-count]").forEach(el => { const v = el.dataset.count; if (v !== "null" && v !== "") countUp(el, +v, x => pct(x)); });
    card.querySelectorAll("[data-count2]").forEach(el => countUp(el, +el.dataset.count2, x => x.toFixed(2)));
    const rc = card.querySelector(".revealchar"); if (rc) anim(rc, { y: [30, 0], opacity: [0, 1], rotate: [8, 0] }, { ...SPRING, delay: 0.3 });
    if (REVEAL_FX) {
      setTimeout(() => celebrate(REVEAL_FX.length ? 1 : 0.45), 260);
      if (REVEAL_FX.length) setTimeout(() => toast(`badge unlocked: <b>${REVEAL_FX.map(b => b.name).join(", ")}</b>`), 700);
    }
  }
}

/* bind events for the current step */
function bindStep(s) {
  const card = $(".card");
  card.querySelectorAll(".opt[data-v]").forEach(b => b.addEventListener("click", () => {
    if (busy) return;
    card.querySelectorAll(".opt").forEach(x => { x.classList.remove("sel"); x.setAttribute("aria-checked", "false"); });
    b.classList.add("sel"); b.setAttribute("aria-checked", "true");
    anim(b, { scale: [0.92, 1.06, 1] }, { duration: 0.32 });
    const val = s.type === "likert" ? +b.dataset.v : b.dataset.v;
    answer(s.id, val, { toast: s.type === "likert" || s.type === "pair" });
  }));
  if (s.type === "likert") {
    const lbl = $("#dotlbl"); const keep = () => { const sel = card.querySelector(".dot.sel"); lbl.innerHTML = sel ? esc(sel.dataset.l) : "&nbsp;"; };
    card.querySelectorAll(".dot").forEach(d => { d.addEventListener("mouseenter", () => (lbl.textContent = d.dataset.l)); d.addEventListener("focus", () => (lbl.textContent = d.dataset.l)); d.addEventListener("mouseleave", keep); });
  }
  if (s.type === "bipolar") $("#bnext").onclick = () => answer(s.id, { feel: +$("#bf").value, lack: +$("#bl").value }, { toast: false, delay: 10 });
  if (s.type === "levels") {
    card.querySelectorAll("input[type=range]").forEach(r => r.addEventListener("input", () => { r.nextElementSibling.textContent = r.value; }));
    $("#gnext").onclick = () => { const o = {}; card.querySelectorAll("input[data-k]").forEach(r => (o[r.dataset.k] = +r.value)); answer("levels", o, { toast: false, delay: 10 }); };
  }
  if (s.type === "hours") {
    const ins = [...card.querySelectorAll("input[data-k]")];
    const upd = () => {
      const t = ins.reduce((a, r) => a + (+r.value || 0), 0);
      const sleep = 56, left = Math.max(0, 168 - sleep - t);
      $("#wbar").innerHTML = `<i style="width:${Math.min(t, 168) / 168 * 100}%;background:var(--s1)"></i><i style="width:${Math.min(sleep, Math.max(0, 168 - t)) / 168 * 100}%;background:repeating-linear-gradient(45deg,var(--axis) 0 3px,transparent 3px 7px)"></i>`;
      $("#wlbl").textContent = t > 112 ? `${t} h logged. more than a waking week, that's the overlap.` : `${t} h logged · ~56 h sleep · ${left} h unaccounted`;
    };
    ins.forEach(r => r.addEventListener("input", upd));
    card.querySelectorAll(".step button").forEach(b => b.addEventListener("click", e => {
      const inp = card.querySelector(`input[data-k="${b.dataset.k}"]`); const stepN = e.shiftKey ? 5 : 1;
      inp.value = clamp((+inp.value || 0) + stepN * +b.dataset.d, 0, 168); upd();
      anim(inp, { scale: [1.18, 1] }, { duration: 0.25 });
    }));
    upd();
    $("#gnext").onclick = () => { const o = {}; ins.forEach(r => (o[r.dataset.k] = clamp(+r.value || 0, 0, 168))); answer("hours", o, { toast: false, delay: 10 }); };
  }
  if (s.type === "wish") {
    card.querySelectorAll(".seg").forEach(sg => sg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { sg.querySelectorAll("button").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); anim(b, { scale: [0.9, 1] }, SPRING); })));
    $("#gnext").onclick = () => { const o = {}; card.querySelectorAll(".seg").forEach(sg => (o[sg.dataset.k] = sg.querySelector(".sel").dataset.v)); answer("wish", o, { toast: false, delay: 10 }); };
  }
  if (s.type === "predict" && s.kind === "slider") {
    const r = $("#pr"), out = $("#prv");
    r.addEventListener("input", () => { out.textContent = s.pctLabel ? r.value + "%" : (+r.value >= 50 ? `${r.value}% hanni` : `${100 - r.value}% nanni`); });
    r.dispatchEvent(new Event("input"));
    $("#prnext").onclick = () => answer(s.id, +r.value, { toast: false, delay: 10 });
  }
  if (s.type === "reflect") {
    const t = $("#rt"); setTimeout(() => t.focus({ preventScroll: true }), 300);

function insights(P) {
  const out = []; const rows = P.rows;
  if (P.hasHours) {
    const g = [...rows].sort((a, b) => (b.r - b.s) - (a.r - a.s)); const o = g[0], u = g[g.length - 1];
    if (o.r - o.s > 0.05) out.push(`<b>${esc(o.label)}</b> gets ${pct(o.r)} of your hours but ${pct(o.s)} of your stated weight. an observer would say you value it more than you claim.`);
    if (u.s - u.r > 0.05) out.push(`<b>${esc(u.label)}</b> is ${pct(u.s)} of what you say matters and ${pct(u.r)} of your week.`);
  }
  const nan = rows.filter(r => r.p < 0.5 && r.s >= 0.1);
  if (nan.length) out.push(`you mostly escape a lack of ${nan.map(r => `<b>${esc(r.label)}</b>`).join(", ")}. those are nanni terms: more brings relief, never joy.`);
  if (P.mot.J != null && P.mot.I != null && P.mot.J > P.mot.I) out.push(`guilt and proving yourself (${P.mot.J.toFixed(1)}) drive your work more than enjoyment (${P.mot.I.toFixed(1)}).`);
  const top = [...rows].sort((a, b) => b.muShare - a.muShare)[0];
  out.push(`your next hour pays most in <b>${esc(top.label)}</b> (${pct(top.muShare)} of marginal utility).`);
  const most = [...rows].sort((a, b) => b.r - a.r)[0];
  if (P.hasHours && most.level >= 8) out.push(`<b>${esc(most.label)}</b> gets the most hours and you're already at ${most.level}/10 there. that's the flat part of the curve.`);
  if (P.MAX != null && P.ADAPT != null && P.MAX >= 3.5 && P.ADAPT >= 3.5) out.push(`you want the best and wins fade fast. that's a treadmill: high effort, short reward.`);
  if (P.T.done && S.a.t_fl >= 4) out.push(`you'll "finally relax" after the next milestone. your answers suggest the finish line will move.`);
  if (P.outdated === "high") out.push(`your priorities changed a lot in five years, your week less. you may be maximizing an outdated function.`);
  if (P.SUNK != null && P.SUNK >= 0.6) out.push(`past investment weighs heavily on your next move (${pct(P.SUNK)}).`);
  if (P.drift != null && P.drift > 0.04) { const m = [...rows].sort((a, b) => (b.w - b.s) - (a.w - a.s)); out.push(`you'd choose more <b>${esc(m[0].label)}</b> and less <b>${esc(m[m.length - 1].label)}</b>. your current week matches ${pct(P.wishAlign)} of the function you wish you had.`); }
  return out;
}

    sr.forEach((x, i) => { const y = i * (bh + gp) + 2; g += `<g data-tip="<b>${esc(x.label)}</b><br>${pct(x.muShare)} of marginal utility<br>level ${x.level}/10 · weight ${pct(x.s)} · ${x.p >= .5 ? "chased" : "escaped"}"><rect x="0" y="${y - 4}" width="${w}" height="${bh + 8}" fill="transparent"/><text x="${l - 12}" y="${y + bh / 2 + 4}" text-anchor="end">${esc(x.label)}</text>${hbar(l, y, Math.max(3, sx(x.muShare)), bh, "var(--s1)", i ? .5 : 1)}<text class="strong" x="${l + sx(x.muShare) + 8}" y="${y + bh / 2 + 4}">${pct(x.muShare)}</text></g>`; });
    const h = sr.length * (bh + gp); g += `<line x1="${l}" x2="${l}" y1="0" y2="${h}" stroke="var(--axis)"/>`;
    el.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="marginal utility">${g}</svg>`; }

  if (P.T.done) { const el = $("#c4"); const w = W(el), h = 230, l = 40, r = 20, t = 14, b = 30; const d = P.T.delta;
    const sx = v => l + v / 20 * (w - l - r), sy = v => t + (1 - v / 100) * (h - t - b);
    let g = ""; [0, 25, 50, 75, 100].forEach(v => (g += `<line x1="${l}" x2="${w - r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/><text class="tick" x="${l - 8}" y="${sy(v) + 4}" text-anchor="end">${v}</text>`));
    [0, 5, 10, 15, 20].forEach(v => (g += `<text class="tick" x="${sx(v)}" y="${h - 8}" text-anchor="middle">${v}y</text>`));
    const line = (dd, c, cls) => `<path class="${cls}" d="${Array.from({ length: 21 }, (_, i) => `${i ? "L" : "M"}${sx(i)} ${sy(100 * Math.pow(dd, i))}`).join("")}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    g += `<path d="${Array.from({ length: 21 }, (_, i) => `${i ? "L" : "M"}${sx(i)} ${sy(100 * Math.pow(d, i))}`).join("")}L${sx(20)} ${sy(0)}L${sx(0)} ${sy(0)}Z" fill="var(--tint-s1)" opacity=".7"/>`;
    g += line(0.9, "var(--ref)", "draw") + line(d, "var(--s1)", "draw");
    for (let i = 0; i <= 20; i++) g += `<g data-tip="<b>${i} years</b><br>you: ${Math.round(100 * Math.pow(d, i))}<br>essay example: ${Math.round(100 * Math.pow(.9, i))}"><rect x="${sx(i) - (w - l - r) / 40}" y="${t}" width="${(w - l - r) / 20}" height="${h - t - b}" fill="transparent"/></g>`;
    g += `<text class="strong" x="${sx(20) - 4}" y="${sy(100 * Math.pow(d, 20)) - 9}" text-anchor="end">${Math.round(100 * Math.pow(d, 20))}</text>`;
    el.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="discount curve">${g}</svg>`; }

  { const el = $("#c5"); const w = W(el), l = 130, r = 20, rh = 40, t = 4;
    const data = [["hanni share", S.a.g_hanni != null ? S.a.g_hanni / 100 : null, P.H], ["say vs do", S.a.g_saydo != null ? S.a.g_saydo / 100 : null, P.align]];
    const sx = v => l + v * (w - l - r); const h = t + data.length * rh + 22; let g = "";
    [0, .25, .5, .75, 1].forEach(v => (g += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${t}" y2="${h - 20}" stroke="var(--grid)"/><text class="tick" x="${sx(v)}" y="${h - 4}" text-anchor="middle">${v * 100}%</text>`));
    data.forEach((d, i) => { const y = t + i * rh + rh / 2; g += `<text x="${l - 12}" y="${y + 4}" text-anchor="end">${d[0]}</text>`;
      if (d[1] != null && d[2] != null) g += `<line x1="${sx(Math.min(d[1], d[2]))}" x2="${sx(Math.max(d[1], d[2]))}" y1="${y}" y2="${y}" stroke="var(--axis)" stroke-width="2"/>`;
      if (d[1] != null) g += `<g data-tip="<b>${d[0]}</b><br>your guess: ${pct(d[1])}">${SH.square(sx(d[1]), y, "var(--s2)")}</g>`;
      if (d[2] != null) g += `<g data-tip="<b>${d[0]}</b><br>your answers: ${pct(d[2])}">${SH.circle(sx(d[2]), y, "var(--s1)")}</g>`; });
    const g1 = S.a.g_top, rank = g1 ? P.top.findIndex(x => x.k === g1) + 1 : null;
    el.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="guesses versus answers">${g}</svg>` + (g1 ? `<p class="sub" style="margin-top:8px">top variable: you guessed <b>${esc(V[g1].label)}</b>, it came out <b>#${rank}</b>.</p>` : ""); }

  bindTips($("#main"));

  /* entrance motion */
  if (M && !REDUCE) {
    const hero = document.querySelectorAll(".rhero > *");
    hero.forEach((h, i) => anim(h, { y: [24, 0], opacity: [0, 1] }, { ...SPRING, delay: 0.1 + i * 0.15 }));
    document.querySelectorAll("[data-count]").forEach(el => { const v = el.dataset.count; if (v !== "null" && v !== "") countUp(el, +v, x => pct(x)); });
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return; io.unobserve(e.target);
      anim(e.target, { y: [28, 0], opacity: [0, 1] }, { duration: 0.6, ease: [0.22, 1, 0.36, 1] });
      e.target.querySelectorAll(".grow").forEach((b, i) => anim(b, { scaleX: [0, 1] }, { duration: 0.8, delay: 0.15 + i * 0.05, ease: [0.22, 1, 0.36, 1] }));
      e.target.querySelectorAll(".mk").forEach((b, i) => anim(b, { opacity: [0, 1] }, { duration: 0.4, delay: 0.1 + i * 0.02 }));
      e.target.querySelectorAll(".draw").forEach(p => { const len = p.getTotalLength(); p.style.strokeDasharray = len; anim(p, { strokeDashoffset: [len, 0] }, { duration: 1.4, ease: [0.22, 1, 0.36, 1] }); });
    }), { threshold: 0.15 });
    document.querySelectorAll(".rcard, .tile").forEach(c => { c.style.opacity = 0; io.observe(c); });
    addEventListener("beforeprint", () => document.querySelectorAll(".rcard, .tile").forEach(c => (c.style.opacity = 1)), { once: true });
  }
}

/* ---------- export ---------- */
function summaryText() {
  const P = profile(); const L = [];
  L.push(`${S.name ? S.name + "'s" : "my"} utility function${P.arch ? ": " + P.arch.name : ""}`, "");
  L.push(equationHTML(P.rows).replace(/<[^>]+>/g, "").replace(/\s+/g, " "));
  if (P.T.done) L.push(`over time: Σ δ^t · U_t, δ ≈ ${P.T.delta.toFixed(2)}`);
  L.push("", `hanni share ${pct(P.H)} · say vs do ${pct(P.align)} · want to change ${pct(P.drift)}`, "");
  L.push("variable | stated | revealed | wished | level");
  [...P.rows].sort((a, b) => b.s - a.s).forEach(r => L.push(`${r.label} | ${pct(r.s)} | ${P.hasHours ? pct(r.r) : "–"} | ${pct(r.w)} | ${r.level}/10`));
  L.push(""); insights(P).forEach(t => L.push("- " + t.replace(/<[^>]+>/g, "")));
  return L.join("\n");
}
function copyText(s, msg) { (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => toast(msg), () => prompt("copy:", s)); }
function copySummary() { copyText(summaryText(), "summary copied"); }
function shareLink() {
  const lite = { ...S, i: FLOW.length - 1, a: { ...S.a } };
  Object.keys(lite.a).forEach(k => { if (/^r\d$/.test(k)) delete lite.a[k]; });
  copyText(location.href.split("#")[0] + "#" + btoa(unescape(encodeURIComponent(JSON.stringify(lite)))), "link copied. it has your answers, not your reflections.");
}

Margin.defs();  /* the hand-drawn wobble filter used by every illustration */
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => step().type === "results" && drawResults(), 150); });
render();
</script>
