<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>what's your utility function?</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #f3f2ee;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --pull: #2a78d6;
  --push: #e34948;
  --ref: #898781;
  --wash: rgba(42,120,214,0.08);
  --wash-strong: rgba(42,120,214,0.16);
  --good: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --surface-2: #232321;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --pull: #3987e5;
    --push: #e66767;
    --wash: rgba(57,135,229,0.12);
    --wash-strong: rgba(57,135,229,0.24);
    --good: #0ca30c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text-primary); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; max-width: 1120px; margin: 0 auto; padding: 24px 24px 80px; }
@media (max-width: 1000px) { .app { grid-template-columns: 1fr; padding: 16px 16px 96px; } aside.panel { display: none; } aside.panel.open { display: block; } }
h1 { font-size: 30px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.015em; }
h2 { font-size: 20px; margin: 0 0 6px; }
h3 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 600; }
p { margin: 0 0 12px; }
.sub { color: var(--text-secondary); }
.muted { color: var(--text-muted); font-size: 13px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; min-height: 32px; }
.chapters { display: flex; gap: 6px; flex: 1; }
.chapters span { flex: 1; height: 4px; border-radius: 2px; background: var(--grid); position: relative; overflow: hidden; }
.chapters span i { position: absolute; inset: 0 auto 0 0; background: var(--series-1); border-radius: 2px; transition: width .3s ease; }
.toplabel { font-size: 12px; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.iconbtn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; color: var(--text-secondary); }

/* the card */
.stage { position: relative; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 32px; min-height: 420px; display: flex; flex-direction: column; }
@media (max-width: 600px) { .card { padding: 22px; min-height: 380px; } }
.card.enter { animation: enter .28s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 14px; }
.prompt { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
.q { font-size: 24px; line-height: 1.35; font-weight: 500; margin: 0 0 28px; letter-spacing: -0.005em; }
@media (max-width: 600px) { .q { font-size: 20px; } }
.spacer { flex: 1; }
.scale { display: grid; gap: 8px; }
.scale.h5 { grid-template-columns: repeat(5, 1fr); }
.scale.h6 { grid-template-columns: repeat(6, 1fr); }
@media (max-width: 700px) { .scale.h5, .scale.h6 { grid-template-columns: 1fr; } }
.opt {
  border: 1px solid var(--border); background: var(--surface-1); border-radius: 12px; padding: 14px 10px;
  cursor: pointer; text-align: center; font-size: 14px; line-height: 1.3; transition: background .12s, border-color .12s, transform .08s;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px;
}
.opt:hover { background: var(--wash); border-color: var(--series-1); }
.opt:active { transform: scale(0.98); }
.opt.sel { background: var(--wash-strong); border-color: var(--series-1); font-weight: 600; }
.opt kbd { font: 11px system-ui; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
@media (max-width: 700px) { .opt { flex-direction: row; justify-content: space-between; min-height: 48px; padding: 12px 16px; text-align: left; } }
.opts-col { display: grid; gap: 8px; }
.opts-col .opt { flex-direction: row; justify-content: space-between; text-align: left; padding: 14px 18px; min-height: 52px; }
.pairgrid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.pairgrid .or { align-self: center; color: var(--text-muted); font-size: 13px; }
.pairgrid .opt { min-height: 140px; font-size: 18px; font-weight: 500; padding: 20px; }
.pairgrid .opt small { font-size: 12px; color: var(--text-muted); font-weight: 400; }
@media (max-width: 700px) { .pairgrid { grid-template-columns: 1fr; } .pairgrid .opt { min-height: 96px; flex-direction: column; justify-content: center; text-align: center; } .pairgrid .or { justify-self: center; } }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 24px; }
.btn { border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--border); background: transparent; font-size: 15px; }
.btn.primary { background: var(--text-primary); color: var(--surface-1); border-color: transparent; }
.btn:disabled { opacity: .35; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.hint { font-size: 12px; color: var(--text-muted); }
.quote { border-left: 2px solid var(--axis); padding: 2px 0 2px 16px; margin: 4px 0 20px; color: var(--text-secondary); font-size: 17px; }

/* sliders & grids */
input[type=range] { width: 100%; accent-color: var(--series-1); height: 28px; }
.bip { margin: 8px 0 22px; }
.bip .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); gap: 16px; }
.bip .ends span:last-child { text-align: right; }
.gridrow { display: grid; grid-template-columns: 140px 1fr 40px; gap: 14px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.gridrow:last-child { border-bottom: 0; }
.gridrow .nm { font-size: 14px; font-weight: 600; }
.gridrow .nm small { display: block; font-weight: 400; color: var(--text-muted); font-size: 12px; }
.gridrow output { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 14px; }
.gridrow input[type=number] { width: 96px; font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 13px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.sel { background: var(--wash-strong); font-weight: 600; }
.wishrow { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
@media (max-width: 600px) { .gridrow, .wishrow { grid-template-columns: 1fr; gap: 4px; } .gridrow output { text-align: left; } }
textarea { width: 100%; min-height: 120px; font: inherit; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); resize: vertical; }
input[type=text] { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); width: 260px; max-width: 100%; }

/* reveal */
.reveal .big { font-size: 56px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; margin: 8px 0 6px; }
.reveal .unlock { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--good); border: 1px solid currentColor; border-radius: 999px; padding: 2px 10px; margin-bottom: 14px; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.vs div { background: var(--surface-2); border-radius: 12px; padding: 14px; }
.vs .k { font-size: 12px; color: var(--text-muted); }
.vs .v { font-size: 26px; font-weight: 600; }

/* panel */
aside.panel { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow: auto; }
@media (max-width: 1000px) {
  aside.panel.open { position: fixed; inset: auto 0 0 0; max-height: 78vh; z-index: 20; background: var(--page); border-top: 1px solid var(--border); padding: 20px 16px 32px; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,.18); }
}
.pcard { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
.peq { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; font-size: 15px; line-height: 1.7; }
.peq .t { white-space: nowrap; }
.peq .t.new { animation: glow 1.2s ease; border-radius: 4px; }
@keyframes glow { from { background: var(--wash-strong); } to { background: transparent; } }
.vbar { display: grid; grid-template-columns: 92px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; margin: 5px 0; }
.vbar .tr { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.vbar .tr i { display: block; height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; transition: width .4s ease, opacity .4s ease; }
.vbar span:last-child { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.meter { margin: 12px 0; font-size: 12px; }
.meter .lbl { display: flex; justify-content: space-between; color: var(--text-secondary); margin-bottom: 4px; }
.meter .track { position: relative; height: 6px; background: var(--surface-2); border-radius: 3px; }
.meter .dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--series-1); border: 2px solid var(--surface-1); transform: translate(-50%, -50%); transition: left .4s ease; }
.meter.locked { color: var(--text-muted); }
.meter.locked .track { background: repeating-linear-gradient(45deg, var(--surface-2) 0 6px, transparent 6px 10px); }
.chlist { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.chlist li { display: flex; gap: 8px; padding: 3px 0; color: var(--text-muted); }
.chlist li.done { color: var(--text-secondary); }
.chlist li.now { color: var(--text-primary); font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; color: var(--text-muted); }
.badge.on { color: var(--text-primary); border-color: var(--series-1); background: var(--wash); }
.fab { display: none; position: fixed; bottom: 16px; right: 16px; z-index: 21; border-radius: 999px; padding: 12px 18px; background: var(--text-primary); color: var(--surface-1); border: 0; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.2); font-size: 14px; }
@media (max-width: 1000px) { .fab { display: block; } }

/* toast */
.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-20px); opacity: 0; background: var(--text-primary); color: var(--surface-1); padding: 8px 16px; border-radius: 999px; font-size: 13px; transition: all .25s ease; z-index: 30; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* results */
.results { grid-column: 1 / -1; max-width: 820px; margin: 0 auto; width: 100%; }
.rcard { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin: 16px 0; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.tile .k { font-size: 12px; color: var(--text-muted); }
.tile .v { font-size: 30px; font-weight: 600; line-height: 1.2; margin: 4px 0; }
.tile .d { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
.eq { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; font-size: 21px; line-height: 1.9; }
.eq .t { white-space: nowrap; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); margin: 8px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg text { fill: var(--text-secondary); font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
svg .tick { fill: var(--text-muted); font-variant-numeric: tabular-nums; }
svg .strong { fill: var(--text-primary); font-weight: 600; }
.list li { margin-bottom: 10px; }
.words blockquote { margin: 0 0 14px; padding: 0 0 0 14px; border-left: 2px solid var(--axis); }
.words blockquote small { display: block; color: var(--text-muted); font-size: 12px; margin-bottom: 2px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.arch { font-size: 44px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.05; margin: 4px 0 12px; }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); opacity: 0; transition: opacity .1s; max-width: 260px; z-index: 40; }
.sources { font-size: 13px; color: var(--text-secondary); }
.sources li { margin-bottom: 4px; }
@media print { .actions, .topbar, .fab, aside { display: none !important; } body { background: #fff; } .rcard { break-inside: avoid; } }
</style>
</head>
<body>
<div class="app" id="app">
  <main id="main"></main>
  <aside class="panel" id="panel"></aside>
</div>
<button class="fab" id="fab" onclick="togglePanel()">your function ↑</button>
<div class="toast" id="toast"></div>
<div id="tip" role="tooltip"></div>

<script>
/* =========================================================================
   content
   ========================================================================= */
const VALUES = [
  { k: "achievement",   sym: "A",  label: "achievement",   pair: "a big professional win",          pairsub: "the kind you'd call your parents about" },
  { k: "relationships", sym: "R",  label: "relationships", pair: "deep time with people you love",  pairsub: "unhurried, phone away" },
  { k: "meaning",       sym: "Me", label: "meaning",       pair: "work that clearly matters",       pairsub: "you can see who it helps" },
  { k: "freedom",       sym: "F",  label: "freedom",       pair: "full control over your calendar", pairsub: "nobody else decides your day" },
  { k: "security",      sym: "S",  label: "security",      pair: "a year of savings in the bank",   pairsub: "nothing can knock you over" },
  { k: "pleasure",      sym: "L",  label: "leisure & fun", pair: "more time to rest and enjoy",     pairsub: "without feeling guilty" },
  { k: "recognition",   sym: "Rc", label: "recognition",   pair: "more respect and visibility",     pairsub: "people know what you've done" },
  { k: "growth",        sym: "G",  label: "growth",        pair: "learning a big new skill",        pairsub: "becoming noticeably better" },
];
const V = Object.fromEntries(VALUES.map(v => [v.k, v]));

const SCALES = {
  agree5: ["strongly disagree", "disagree", "neutral", "agree", "strongly agree"],
  like6: ["not like me at all", "not like me", "a little like me", "somewhat like me", "like me", "very much like me"],
};

/* item bank. items are original, written for this tool, inspired by the constructs cited in the method notes. */
const ITEMS = {
  // values (portrait format, Schwartz PVQ-inspired)
  v_a1: { scale: "like6", value: "achievement",   text: "being successful matters a lot to them. they like to show what they can do." },
  v_r1: { scale: "like6", value: "relationships", text: "they make time for the people close to them, even when it's inconvenient." },
  v_m1: { scale: "like6", value: "meaning",       text: "they need their work to matter beyond the paycheck." },
  v_f1: { scale: "like6", value: "freedom",       text: "they want to decide for themselves what to do and when." },
  v_s1: { scale: "like6", value: "security",      text: "they want a solid financial cushion before they take risks." },
  v_l1: { scale: "like6", value: "pleasure",      text: "they take every chance to enjoy life and have fun." },
  v_c1: { scale: "like6", value: "recognition",   text: "it matters to them that people respect what they've achieved." },
  v_g1: { scale: "like6", value: "growth",        text: "they look for new challenges and want to keep learning." },
  v_a2: { scale: "like6", value: "achievement",   text: "they set ambitious goals and feel restless when they aren't making progress." },
  v_r2: { scale: "like6", value: "relationships", text: "for them, a good week is one spent with people they love." },
  v_m2: { scale: "like6", value: "meaning",       text: "they care about leaving things better than they found them." },
  v_f2: { scale: "like6", value: "freedom",       text: "they would take a lower salary for more control over their time." },
  v_s2: { scale: "like6", value: "security",      text: "a stable, predictable life is important to them." },
  v_l2: { scale: "like6", value: "pleasure",      text: "doing nothing, without guilt, is something they value." },
  v_c2: { scale: "like6", value: "recognition",   text: "they like being seen as someone important." },
  v_g2: { scale: "like6", value: "growth",        text: "they get bored when things stay the same for too long." },

  // why you work (self-determination theory, WEIMS-inspired)
  w_i1: { scale: "agree5", prompt: "i work as hard as i do because…", text: "i enjoy the work itself." },
  w_e1: { scale: "agree5", prompt: "i work as hard as i do because…", text: "people around me expect it." },
  w_d1: { scale: "agree5", prompt: "i work as hard as i do because…", text: "it moves me toward things i find important." },
  w_j1: { scale: "agree5", prompt: "i work as hard as i do because…", text: "i would feel guilty if i did less." },
  w_i2: { scale: "agree5", prompt: "i work as hard as i do because…", text: "solving hard problems is fun for me." },
  w_e2: { scale: "agree5", prompt: "i work as hard as i do because…", text: "the money and status depend on it." },
  w_j2: { scale: "agree5", prompt: "i work as hard as i do because…", text: "i need to prove to myself that i'm good enough." },
  w_d2: { scale: "agree5", prompt: "i work as hard as i do because…", text: "i chose this path and i stand behind it." },

  // passion (dualistic model of passion, Vallerand-inspired)
  p_h1: { scale: "agree5", prompt: "think of the thing you put the most energy into.", text: "it fits well with the other parts of my life." },
  p_o1: { scale: "agree5", prompt: "think of the thing you put the most energy into.", text: "i find it hard to switch off from it." },
  p_h2: { scale: "agree5", prompt: "think of the thing you put the most energy into.", text: "i can step away from it for a while without trouble." },
  p_o2: { scale: "agree5", prompt: "think of the thing you put the most energy into.", text: "my mood depends on how it's going." },
  p_h3: { scale: "agree5", prompt: "think of the thing you put the most energy into.", text: "it brings out the best in me." },
  p_o3: { scale: "agree5", prompt: "think of the thing you put the most energy into.", text: "if i couldn't do it, i wouldn't know who i am." },

  // regulatory focus (Higgins-inspired)
  f_p1: { scale: "like6", text: "they think a lot about what they could achieve." },
  f_v1: { scale: "like6", text: "they think a lot about mistakes they want to avoid." },
  f_p2: { scale: "like6", text: "the chance to win is what gets them out of bed." },
  f_v2: { scale: "like6", text: "the fear of failing is what keeps them going." },

  // maximizing & adaptation
  x_m1: { scale: "agree5", text: "i never settle for second best." },
  x_m2: { scale: "agree5", text: "i often wonder if there's something better out there." },
  x_m3: { scale: "agree5", text: "good enough is usually good enough for me.", reverse: true },
  x_m4: { scale: "agree5", text: "i spend a lot of time comparing my options, even after i've decided." },
  x_a1: { scale: "agree5", text: "my last big achievement stopped feeling special within a few weeks." },
  x_a2: { scale: "agree5", text: "each win feels a little smaller than the one before." },

  // time (consideration of future consequences-inspired)
  t_c1: { scale: "agree5", text: "i often give up happiness today for a better future." },

  t_fl: { scale: "agree5", text: "once i reach my next milestone, i'll finally relax." },

  // sunk cost, identity, environment
  s_i1: { scale: "agree5", text: "leaving my current path would feel like wasting everything i've put in." },
  s_i2: { scale: "agree5", text: "if i stopped being \"the ambitious one\", i'm not sure who i'd be." },
  e_n1: { scale: "agree5", text: "my goals look a lot like the goals of the people around me." },
  e_n2: { scale: "agree5", text: "some of my ambitions came from my environment, and i'm not sure they're mine." },

  // second-order desires
  o_d1: { scale: "agree5", text: "i wish i depended less on other people's approval." },
  o_d2: { scale: "agree5", text: "i wish i could enjoy success without needing the next one." },

/* =========================================================================
   scoring
   ========================================================================= */
const mean = xs => { const v = xs.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const normalize = xs => { const s = xs.reduce((a, b) => a + b, 0); return s > 0 ? xs.map(x => x / s) : xs.map(() => 1 / xs.length); };
function item(id) { const v = S.a[id]; if (v == null) return null; const it = ITEMS[id]; const max = it.scale === "like6" ? 6 : 5; return it.reverse ? max + 1 - v : v; }
const items = ids => mean(ids.map(item));
const pref = p => Object.keys(ITEMS).filter(k => k.startsWith(p));

function valueScores() {
  // ipsatized portrait ratings + pairwise wins
  const raw = VALUES.map(v => mean(Object.keys(ITEMS).filter(k => ITEMS[k].value === v.k).map(item)));
  const known = raw.filter(x => x != null);
  const m = known.length ? mean(known) : 3.5;
  const bt = Object.fromEntries(VALUES.map(v => [v.k, { w: 0, n: 0 }]));
  Object.entries(S.pairs).forEach(([id, pr]) => {
    const pick = S.a[id]; if (!pick) return;
    pr.forEach(k => { bt[k].n++; if (k === pick) bt[k].w++; });
  });
  return VALUES.map((v, i) => {
    const c = raw[i] == null ? 0 : raw[i] - m;
    const b = bt[v.k].n ? (2 * bt[v.k].w - bt[v.k].n) / bt[v.k].n : 0;
    const nItems = Object.keys(ITEMS).filter(k => ITEMS[k].value === v.k && S.a[k] != null).length;
    return { k: v.k, score: c + 0.8 * b, clarity: clamp((nItems + bt[v.k].n * 0.7) / 3.4, 0, 1), raw: raw[i] };
  });
}
function statedWeights() {
  const vs = valueScores();
  const ex = vs.map(x => Math.exp(0.85 * x.score));
  const w = normalize(ex);
  return vs.map((x, i) => ({ ...x, w: w[i] }));
}
function motivation() {
  const I = items(["w_i1", "w_i2"]), D = items(["w_d1", "w_d2"]), J = items(["w_j1", "w_j2"]), E = items(["w_e1", "w_e2"]);
  const HP = items(["p_h1", "p_h2", "p_h3"]), OP = items(["p_o1", "p_o2", "p_o3"]);
  const PRO = items(["f_p1", "f_p2"]), PRE = items(["f_v1", "f_v2"]);
  const parts = [];
  if (I != null && D != null && J != null && E != null) parts.push([((I + D) / 2) / ((I + D) / 2 + (J + E) / 2), 0.35]);
  if (HP != null && OP != null) parts.push([HP / (HP + OP), 0.25]);
  if (PRO != null && PRE != null) parts.push([PRO / (PRO + PRE), 0.15]);
  const bp = (S.top4 || []).map((k, i) => valuePull(i)).filter(x => x != null);
  if (bp.length) parts.push([mean(bp), 0.25]);
  const tw = parts.reduce((a, p) => a + p[1], 0);
  const H = tw ? parts.reduce((a, p) => a + p[0] * p[1], 0) / tw : null;
  // relative autonomy index, range -9..9 on 1-5 items
  const RAI = (I != null && D != null && J != null && E != null) ? 2 * I + D - J - 2 * E : null;
  return { I, D, J, E, HP, OP, PRO, PRE, H, RAI };
}
function valuePull(i) {
  const a = S.a["b" + i]; if (!a) return null;
  const p1 = 1 - a.feel / 100, p2 = 1 - a.lack / 100;
  return 0.6 * p1 + 0.4 * p2;
}
function pullFor(k, H) {
  const i = (S.top4 || []).indexOf(k);
  const p = i >= 0 ? valuePull(i) : null;
  return p != null ? p : (H != null ? H : 0.6);
}
function titration() {
  let lo = 0, hi = 7; const rounds = [];
  for (let r = 0; r < 3; r++) {
    const mid = Math.floor((lo + hi) / 2);
    rounds.push(TITR_X[mid]);
    const ans = S.a["t" + r]; if (!ans) return { next: TITR_X[mid], round: r, done: false };
    if (ans === "later") hi = mid; else lo = mid + 1;
  }
  const b = lo;
  const xstar = b === 0 ? 1005 : b === 7 ? 2400 : (TITR_X[b - 1] + TITR_X[b]) / 2;
  return { done: true, xstar, delta: 1000 / xstar, bin: b };
}
function profile() {
  const sw = statedWeights();
  const mot = motivation();
  const H = mot.H;
  const hours = VALUES.map(v => +((S.a.hours || {})[v.k] || 0));
  const rw = normalize(hours);
  const wishF = { less: 0.6, same: 1, more: 1.5, much: 2 };
  const ww = normalize(sw.map(x => x.w * (wishF[(S.a.wish || {})[x.k]] || 1)));
  const lv = S.a.levels || {};
  const rows = VALUES.map((v, i) => {
    const p = pullFor(v.k, H);
    const x = lv[v.k] != null ? lv[v.k] : 5;
    const mu = sw[i].w * (p / ((1 + x) * Math.log(11)) + (1 - p) * 1.1 / ((1 + x) * (1 + x)));
    return { ...v, s: sw[i].w, clarity: sw[i].clarity, r: rw[i], w: ww[i], p, level: x, hours: hours[i], mu };
  });
  const muN = normalize(rows.map(r => r.mu)); rows.forEach((r, i) => (r.muShare = muN[i]));
  const hasHours = hours.some(h => h > 0);
  const align = hasHours ? 1 - 0.5 * rows.reduce((a, r) => a + Math.abs(r.s - r.r), 0) : null;
  const wishAlign = hasHours ? 1 - 0.5 * rows.reduce((a, r) => a + Math.abs(r.w - r.r), 0) : null;
  const drift = S.a.wish ? 0.5 * rows.reduce((a, r) => a + Math.abs(r.s - r.w), 0) : null;
  const MAX = items(["x_m1", "x_m2", "x_m3", "x_m4"]);
  const raiseMap = { days: 5, weeks: 4, months: 2.5, longer: 1.5 };
  const ADAPT = mean([items(["x_a1", "x_a2"]), S.a.c_raise ? raiseMap[S.a.c_raise] : null]);
  const T = titration();
  const CFC = items(["t_c1", "t_c2", "t_c3"]);
  const sunkParts = [S.a.c_concert ? (S.a.c_concert === "go" ? 1 : 0) : null,
                     S.a.c_project ? ({ keep: 1, unsure: 0.6, switch: 0 })[S.a.c_project] : null,
                     items(["s_i1", "s_i2"]) != null ? (items(["s_i1", "s_i2"]) - 1) / 4 : null];
  const SUNK = mean(sunkParts);
  const ENDO = items(["e_n1", "e_n2"]);
  const outdated = S.a.c_change === "lot" && S.a.c_routine === "less" ? "high" : (S.a.c_change && S.a.c_change !== "barely" && S.a.c_routine === "less") ? "medium" : S.a.c_change ? "low" : null;
  const top = [...rows].sort((a, b) => b.s - a.s);
  const arch = (H != null && MAX != null) ? archetype(H, MAX) : null;
  return { rows, top, mot, H, align, wishAlign, drift, MAX, ADAPT, T, CFC, SUNK, ENDO, outdated, arch, hasHours };
}
function archetype(H, MAX) {
  const pull = H >= 0.5, maxi = MAX >= 3;
  if (pull && maxi) return { key: "climber", name: "the climber", line: "you chase what you love, and you want the best version of it. hanni at full speed.", watch: "watch the curve flatten. the fourth promotion can make you less happy than the first." };
  if (pull) return { key: "gardener", name: "the gardener", line: "you grow what you love, and you know when enough is enough.", watch: "watch for drift. a comfortable function can quietly go out of date." };
  if (maxi) return { key: "runner", name: "the runner", line: "you run hard and well, partly away from something. more brings relief, not joy.", watch: "watch the finish line. it keeps moving, because the engine is the fear, not the goal." };
  return { key: "guardian", name: "the guardian", line: "you protect what you have. avoiding loss weighs more than the next win.", watch: "watch for a life built around fears instead of wants." };
}
function consistency() {
  const pairs = [];
  const add = (a, b) => { if (a != null && b != null) pairs.push(1 - Math.abs(a - b) / 4); };
  // never settle (x_m1) vs good enough is fine (x_m3 reversed already in item())
  add(item("x_m1"), item("x_m3"));
  // future focus vs present focus (t_c2 reversed)
  add(item("t_c1"), item("t_c2"));
  // can step away (p_h2) vs hard to switch off (p_o1, inverted)
  if (item("p_h2") != null && item("p_o1") != null) add(item("p_h2"), 6 - item("p_o1"));
  return pairs.length ? mean(pairs) : null;
}
function badges(P) {
  const reflections = Object.keys(S.a).filter(k => /^r\d$/.test(k) && (S.a[k] || "").trim().length > 3).length;
  const cons = consistency();

}

function equationHTML(rows, H, limit, prev) {
  const rs = [...rows].sort((a, b) => b.s - a.s).slice(0, limit || rows.length);
  return `<i>U</i> = ` + rs.map((r, i) => {
    const hanni = r.p >= 0.5;
    const sign = hanni ? (i ? " + " : "") : (i ? " − " : "−");
    const term = hanni ? `${f2(r.s)}·ln(1+<i>${r.sym}</i>)` : `${f2(r.s)}/(1+<i>${r.sym}</i>)`;
    const isNew = prev && prev[r.k] !== undefined && Math.abs(prev[r.k] - r.s) > 0.01;
    return `<span class="t${isNew ? " new" : ""}">${sign}${term}</span>`;
  }).join(" ") + (limit && rows.length > limit ? ` <span class="t">+ …</span>` : "");
}

function answer(id, val, opts = {}) {
  const before = statedWeights();
  S.a[id] = val; save();

  if (opts.advance !== false) { renderPanel(); setTimeout(() => go(1), 240); }
  else renderPanel();

function feedback(before) {
  const after = statedWeights();
  let best = null;
  after.forEach((x, i) => { const dlt = x.w - before[i].w; if (!best || Math.abs(dlt) > Math.abs(best.d)) best = { k: x.k, d: dlt }; });
  if (best && Math.abs(best.d) >= 0.01) toast(`${V[best.k].label} ${best.d > 0 ? "↑" : "↓"} ${Math.abs(Math.round(best.d * 100))} pts in your function`);
}

/* adaptive pair selection: compare values whose scores are close and that we know least about */
function pickPair() {
  const sc = Object.fromEntries(valueScores().map(x => [x.k, x.score]));
  const seen = new Set(Object.values(S.pairs).map(p => [...p].sort().join("|")));
  const appear = Object.fromEntries(VALUES.map(v => [v.k, 0]));
  Object.values(S.pairs).forEach(p => p.forEach(k => appear[k]++));
  let best = null;
  for (let i = 0; i < VALUES.length; i++) for (let j = i + 1; j < VALUES.length; j++) {
    const a = VALUES[i].k, b = VALUES[j].k; if (seen.has([a, b].sort().join("|"))) continue;
    const cost = Math.abs(sc[a] - sc[b]) + 0.6 * (appear[a] + appear[b]) + Math.random() * 0.15;
    if (!best || cost < best.c) best = { c: cost, p: Math.random() < 0.5 ? [a, b] : [b, a] };
  }
  return best.p;
}

/* bind events for the current step */
function bindStep(s) {
  const card = $(".card");
  card.querySelectorAll(".opt[data-v]").forEach(b => b.addEventListener("click", () => {
    card.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel");
    const raw = b.dataset.v; const val = s.type === "likert" ? +raw : raw;
    answer(s.id, val, { toast: s.type === "likert" || s.type === "pair" });
  }));
  if (s.type === "bipolar") {
    const f = $("#bf"), l = $("#bl");
    $("#bnext").onclick = () => answer(s.id, { feel: +f.value, lack: +l.value }, { toast: false });
  }
  if (s.type === "levels") {
    card.querySelectorAll("input[type=range]").forEach(r => r.addEventListener("input", () => { r.nextElementSibling.textContent = r.value; }));
    $("#gnext").onclick = () => { const o = {}; card.querySelectorAll("input[data-k]").forEach(r => (o[r.dataset.k] = +r.value)); answer("levels", o, { toast: false }); };
  }
  if (s.type === "hours") {
    const upd = () => { let t = 0; card.querySelectorAll("input[data-k]").forEach(r => (t += +r.value || 0)); $("#hsum").textContent = `${t} hours logged`; };
    card.querySelectorAll("input[data-k]").forEach(r => r.addEventListener("input", upd)); upd();
    $("#gnext").onclick = () => { const o = {}; card.querySelectorAll("input[data-k]").forEach(r => (o[r.dataset.k] = clamp(+r.value || 0, 0, 168))); answer("hours", o, { toast: false }); };
  }
  if (s.type === "wish") {
    card.querySelectorAll(".seg").forEach(sg => sg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { sg.querySelectorAll("button").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); })));
    $("#gnext").onclick = () => { const o = {}; card.querySelectorAll(".seg").forEach(sg => (o[sg.dataset.k] = sg.querySelector(".sel").dataset.v)); answer("wish", o, { toast: false }); };
  }
  if (s.type === "predict" && s.kind === "slider") {
    const r = $("#pr"); r.addEventListener("input", () => { if (s.pctLabel) $("#prv").textContent = r.value + "%"; });
    $("#prnext").onclick = () => answer(s.id, +r.value, { toast: false });
  }
  if (s.type === "reflect") {
    const t = $("#rt"); t.focus();
    $("#rnext").onclick = () => answer(s.id, t.value.trim(), { toast: false });
  }
}

document.addEventListener("keydown", e => {
  const s = step(); if (!s || e.target.matches("input, textarea")) return;
  if (/^[1-9]$/.test(e.key)) { const opts = document.querySelectorAll(".card .opt[data-v]"); const b = opts[+e.key - 1]; if (b) b.click(); }
  if (e.key === "ArrowLeft" && S.i > 1 && s.type !== "results") go(-1);
  if (e.key === "Enter") { const p = document.querySelector(".card .btn.primary"); if (p) p.click(); }
});

function reflectionsHTML() {

function insights(P) {
  const out = []; const rows = P.rows;
  if (P.hasHours) {
    const g = [...rows].sort((a, b) => (b.r - b.s) - (a.r - a.s)); const o = g[0], u = g[g.length - 1];
    if (o.r - o.s > 0.05) out.push(`<b>${esc(o.label)}</b> gets ${pct(o.r)} of your hours but ${pct(o.s)} of your stated weight. an observer would say you value it more than you claim.`);
    if (u.s - u.r > 0.05) out.push(`<b>${esc(u.label)}</b> is ${pct(u.s)} of what you say matters and ${pct(u.r)} of your week.`);
  }
  const nan = rows.filter(r => r.p < 0.5 && r.s >= 0.1);
  if (nan.length) out.push(`you mostly escape a lack of ${nan.map(r => `<b>${esc(r.label)}</b>`).join(", ")}. those are nanni terms: more brings relief, never joy.`);
  if (P.mot.J != null && P.mot.I != null && P.mot.J > P.mot.I) out.push(`guilt and proving yourself (${P.mot.J.toFixed(1)}) drive your work more than enjoyment (${P.mot.I.toFixed(1)}).`);
  const top = [...rows].sort((a, b) => b.muShare - a.muShare)[0];
  out.push(`your next hour pays most in <b>${esc(top.label)}</b> (${pct(top.muShare)} of marginal utility).`);
  const most = [...rows].sort((a, b) => b.r - a.r)[0];
  if (P.hasHours && most.level >= 8) out.push(`<b>${esc(most.label)}</b> gets the most hours and you're already at ${most.level}/10 there. that's the flat part of the curve.`);
  if (P.MAX != null && P.ADAPT != null && P.MAX >= 3.5 && P.ADAPT >= 3.5) out.push(`you want the best and wins fade fast. that's a treadmill: high effort, short reward.`);
  if (P.T.done && S.a.t_fl >= 4) out.push(`you'll "finally relax" after the next milestone. your answers suggest the finish line will move.`);
  if (P.outdated === "high") out.push(`your priorities changed a lot in five years, your week less. you may be maximizing an outdated function.`);
  if (P.SUNK != null && P.SUNK >= 0.6) out.push(`past investment weighs heavily on your next move (${pct(P.SUNK)}).`);
  if (P.drift != null && P.drift > 0.04) { const m = [...rows].sort((a, b) => (b.w - b.s) - (a.w - a.s)); out.push(`you'd choose more <b>${esc(m[0].label)}</b> and less <b>${esc(m[m.length - 1].label)}</b>. your current week matches ${pct(P.wishAlign)} of the function you wish you had.`); }
  return out;
}

    const data = [["hanni share", S.a.g_hanni != null ? S.a.g_hanni / 100 : null, P.H], ["say vs do", S.a.g_saydo != null ? S.a.g_saydo / 100 : null, P.align]];
    const sx = v => l + v * (w - l - r); const h = t + data.length * rh + 22; let g = "";
    [0, .25, .5, .75, 1].forEach(v => (g += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${t}" y2="${h - 20}" stroke="var(--grid)"/><text class="tick" x="${sx(v)}" y="${h - 4}" text-anchor="middle">${v * 100}%</text>`));
    data.forEach((d, i) => { const y = t + i * rh + rh / 2; g += `<text x="${l - 12}" y="${y + 4}" text-anchor="end">${d[0]}</text>`;
      if (d[1] != null && d[2] != null) g += `<line x1="${sx(Math.min(d[1], d[2]))}" x2="${sx(Math.max(d[1], d[2]))}" y1="${y}" y2="${y}" stroke="var(--axis)" stroke-width="2"/>`;
      if (d[1] != null) g += `<g data-tip="<b>${d[0]}</b><br>your guess: ${pct(d[1])}">${SH.square(sx(d[1]), y, "var(--series-2)")}</g>`;
      if (d[2] != null) g += `<g data-tip="<b>${d[0]}</b><br>your answers: ${pct(d[2])}">${SH.circle(sx(d[2]), y, "var(--series-1)")}</g>`; });
    const g1 = S.a.g_top, rank = g1 ? P.top.findIndex(x => x.k === g1) + 1 : null;
    el.innerHTML = `<svg width="${w}" height="${h}" role="img" aria-label="guesses versus answers">${g}</svg>` + (g1 ? `<p class="sub" style="margin-top:8px">top variable: you guessed <b>${esc(V[g1].label)}</b>, it came out <b>#${rank}</b>.</p>` : ""); }

  bindTips($("#main"));
}

/* ---------- export ---------- */
function summaryText() {
  const P = profile(); const L = [];
  L.push(`${S.name ? S.name + "'s" : "my"} utility function${P.arch ? ": " + P.arch.name : ""}`, "");
  L.push(equationHTML(P.rows, P.H).replace(/<[^>]+>/g, "").replace(/\s+/g, " "));
  if (P.T.done) L.push(`over time: Σ δ^t · U_t, δ ≈ ${P.T.delta.toFixed(2)}`);
  L.push("", `hanni share ${pct(P.H)} · say vs do ${pct(P.align)} · want to change ${pct(P.drift)}`, "");
  L.push("variable | stated | revealed | wished | level");
  [...P.rows].sort((a, b) => b.s - a.s).forEach(r => L.push(`${r.label} | ${pct(r.s)} | ${P.hasHours ? pct(r.r) : "–"} | ${pct(r.w)} | ${r.level}/10`));
  L.push(""); insights(P).forEach(t => L.push("- " + t.replace(/<[^>]+>/g, "")));
  return L.join("\n");
}
function copyText(s, msg) { (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => toast(msg), () => prompt("copy:", s)); }
function copySummary() { copyText(summaryText(), "summary copied"); }
function shareLink() {
  const lite = { ...S, i: FLOW.length - 1 }; // reflections stay private
  Object.keys(lite.a = { ...S.a }).forEach(k => { if (/^r\d$/.test(k)) delete lite.a[k]; });
  copyText(location.href.split("#")[0] + "#" + btoa(unescape(encodeURIComponent(JSON.stringify(lite)))), "link copied. it contains your answers, not your reflections.");
}

let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => step().type === "results" && drawResults(), 150); });
render();
</script>
